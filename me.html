<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>予約・回数券の確認 ｜ リラクゼーション＆ピラティス gait</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --g:#2e9e72; --gd:#1f7a56; --gl:#e6f5ee; --gxl:#f2faf6;
  --ink:#1c2b24; --sub:#68796f; --line:#dfe9e3; --bg:#f4f7f5;
  --warn:#c0392b; --line-green:#06c755;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
     background:var(--bg);color:var(--ink);font-size:15px;line-height:1.75;padding-bottom:60px}
.appbar{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:16px 18px;
        display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:17px;letter-spacing:.06em;line-height:1.2}
.logo small{font-weight:600;font-size:9px;display:block;opacity:.85;letter-spacing:.18em}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;
      box-shadow:0 1px 3px rgba(30,60,45,.05)}
.card h2{font-size:15px;color:var(--gd);margin-bottom:10px}
.notice{font-size:12.5px;color:var(--sub);line-height:1.8}
.field{margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--sub);display:block;margin-bottom:3px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:12px;font-size:16px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--g)}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:none;border-radius:12px;padding:14px;
     font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:active{background:var(--gd)}
.btn.sub{background:#fff;color:var(--gd);border:1.5px solid var(--g);margin-top:10px}
.err{background:#fdeceb;color:var(--warn);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:12px;display:none}
.hello{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.hello .nm{font-size:20px;font-weight:800}
.hello .vs{font-size:12.5px;opacity:.9;margin-top:2px}
.bk{border-left:3px solid var(--g);background:var(--gxl);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:9px}
.bk .d{font-weight:800;font-size:15.5px}
.bk .m{font-size:12.5px;color:var(--sub)}
.tk{margin-bottom:14px}
.tkTop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tkBig{font-size:34px;font-weight:800;color:var(--gd);line-height:1}
.tkMeta{margin-left:auto;font-size:11.5px;color:var(--sub)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.dot{width:13px;height:13px;border-radius:50%;background:var(--g)}
.dot.used{background:#dfe9e3}
footer{text-align:center;font-size:11.5px;color:var(--sub);padding:20px 16px;line-height:1.9}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">gait<small>RESERVATION CHECK</small></div>
</div>

<main>
  <div id="form">
    <div class="card">
      <h2>ご予約・回数券の確認</h2>
      <p class="notice" style="margin-bottom:14px">
        ご登録の<b>電話番号</b>と<b>生年月日</b>を入力してください。<br>
        アプリの会員登録をされていない方でもご確認いただけます。
      </p>
      <div class="err" id="err"></div>
      <div class="field">
        <label>電話番号</label>
        <input id="tel" type="tel" inputmode="numeric" placeholder="09012345678" autocomplete="tel">
      </div>
      <div class="field">
        <label>生年月日</label>
        <input id="dob" type="date">
      </div>
      <button class="btn" id="btn" onclick="lookup()">確認する</button>
    </div>
    <div class="card">
      <h2>会員の方へ</h2>
      <p class="notice">アプリに登録いただくと、ご自身での予約・カルテの閲覧・宿題動画の視聴ができます。</p>
      <button class="btn sub" onclick="location.href='/'">予約アプリを開く</button>
    </div>
  </div>

  <div id="result" style="display:none">
    <div class="hello">
      <div class="nm" id="rName"></div>
      <div class="vs" id="rVisits"></div>
    </div>

    <div class="card">
      <h2>📋 今後のご予約</h2>
      <div id="rBookings"></div>
    </div>

    <div class="card">
      <h2>🎟 回数券の残り</h2>
      <div id="rTickets"></div>
    </div>

    <button class="btn" onclick="location.href='/'">予約アプリを開く</button>
    <button class="btn sub" onclick="reset()">別の方を確認する</button>
  </div>
</main>

<footer>
  リラクゼーション＆ピラティス gait（岡山）<br>
  ご不明な点は公式LINE、またはお電話でお問い合わせください。
</footer>

<script>
const SB_URL = "https://pizzhyvqptkhigwwhorp.supabase.co";
const SB_KEY = "sb_publishable_xrUSPujoggvnmDDzT6idXg_qgkcLJlg";
const sb = supabase.createClient(SB_URL, SB_KEY);
const WD = ["日","月","火","水","木","金","土"];

function fmtTs(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showErr(m){const e=document.getElementById("err");e.style.display=m?"block":"none";e.textContent=m||""}
function reset(){
  document.getElementById("result").style.display="none";
  document.getElementById("form").style.display="block";
  document.getElementById("tel").value=""; document.getElementById("dob").value=""; showErr("");
}

async function lookup(){
  showErr("");
  const tel = document.getElementById("tel").value.replace(/[^0-9]/g,"");
  const dob = document.getElementById("dob").value;
  if(tel.length < 10){ showErr("電話番号を正しく入力してください（ハイフンなし）"); return; }
  if(!dob){ showErr("生年月日を入力してください"); return; }

  const btn = document.getElementById("btn");
  btn.disabled = true; btn.textContent = "確認しています…";
  const { data, error } = await sb.rpc("guest_lookup", { p_tel: tel, p_dob: dob });
  btn.disabled = false; btn.textContent = "確認する";

  if(error){ showErr("うまく確認できませんでした。時間をおいてお試しください。"); return; }
  if(!data || !data.ok){
    showErr("該当する情報が見つかりませんでした。電話番号と生年月日をご確認ください。お心当たりのない場合は、スタジオまでお問い合わせください。");
    return;
  }

  document.getElementById("rName").textContent = (data.name || "お客様") + " さん";
  document.getElementById("rVisits").textContent = data.visits ? "これまでのご来店 " + data.visits + "回" : "";

  const bks = data.bookings || [];
  document.getElementById("rBookings").innerHTML = bks.length
    ? bks.map(b=>`<div class="bk"><div class="d">${fmtTs(b.starts_at)}〜</div><div class="m">${esc(b.menu)}</div></div>`).join("")
    : '<p class="notice">今後のご予約はありません。<br>アプリまたはお電話・LINEでご予約いただけます。</p>';

  const tks = data.tickets || [];
  document.getElementById("rTickets").innerHTML = tks.length
    ? tks.map(t=>{
        const used = t.total - t.left;
        return `<div class="tk">
          <div class="tkTop"><span class="tkBig">${t.left}</span><span style="font-weight:700">回 のこっています</span>
            <span class="tkMeta">${esc(t.kind)} ${t.total}回券${t.expires?" ｜ 期限 "+t.expires:""}</span></div>
          <div class="dots">${Array.from({length:t.total},(_,i)=>`<span class="dot ${i<used?'used':''}"></span>`).join("")}</div>
        </div>`;
      }).join("")
    : '<p class="notice">有効な回数券はありません。</p>';

  document.getElementById("form").style.display="none";
  document.getElementById("result").style.display="block";
  window.scrollTo(0,0);
}

document.getElementById("tel").addEventListener("keydown", e=>{ if(e.key==="Enter") document.getElementById("dob").focus(); });
document.getElementById("dob").addEventListener("keydown", e=>{ if(e.key==="Enter") lookup(); });
</script>
</body>
</html>
