<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>駐車場のご案内 ｜ リラクゼーション＆ピラティス gait</title>
<style>
:root{ --g:#2e9e72; --gd:#1f7a56; --gxl:#f2faf6; --ink:#1c2b24; --sub:#68796f; --line:#dfe9e3; --bg:#f4f7f5; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
     background:var(--bg);color:var(--ink);font-size:15px;line-height:1.85}
.appbar{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:16px 18px}
.logo{font-weight:800;font-size:17px;letter-spacing:.06em;line-height:1.2}
.logo small{font-weight:600;font-size:9px;display:block;opacity:.85;letter-spacing:.18em}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;
      box-shadow:0 1px 3px rgba(30,60,45,.05)}
.card h2{font-size:15px;color:var(--gd);margin-bottom:10px}
.step{display:flex;gap:11px;margin-bottom:13px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:12.5px;font-weight:800;
         display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px}
.step .t{font-size:14px}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:none;border-radius:12px;padding:14px;
     font-size:15px;font-weight:700;cursor:pointer;text-align:center;font-family:inherit;text-decoration:none;margin-top:6px}
.btn.sub{background:#fff;color:var(--gd);border:1.5px solid var(--g);margin-top:10px}
.note{background:var(--gxl);border-radius:12px;padding:13px 15px;font-size:13.5px;color:var(--ink);line-height:1.85}
footer{text-align:center;font-size:11.5px;color:var(--sub);padding:10px 16px 40px;line-height:1.9}
</style>
</head>
<body>

<div class="appbar">
  <div class="logo">gait<small>PARKING</small></div>
</div>

<main>
  <div class="card">
    <h2>🅿️ 駐車場のご案内</h2>
    <div class="note">
      ただいまご案内ページを準備しております。<br>
      お停めになる場所についてご不明な点は、お手数ですが公式LINEにメッセージをお送りいただくか、お電話ください。折り返しご案内いたします。
    </div>
  </div>

  <div class="card">
    <h2>📍 スタジオの場所</h2>
    <p style="font-size:14px;margin-bottom:10px">リラクゼーション＆ピラティス gait（岡山）</p>
    <a class="btn" target="_blank" rel="noopener"
       href="https://www.google.com/maps/search/?api=1&query=%E3%83%AA%E3%83%A9%E3%82%AF%E3%82%BC%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3%EF%BC%86%E3%83%94%E3%83%A9%E3%83%86%E3%82%A3%E3%82%B9gait%20%E5%B2%A1%E5%B1%B1">Googleマップで見る</a>
    <a class="btn sub" href="/">予約アプリを開く</a>
  </div>
</main>

<footer>リラクゼーション＆ピラティス gait（岡山）</footer>
</body>
</html>
